<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>五反田さんぽ</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/css/splide.min.css">
  <link rel="stylesheet" href="./css/common.css">

  <script src="https://cdn.jsdelivr.net/npm/@splidejs/splide@4.1.4/dist/js/splide.min.js"></script>
  <script src="./js/script.js" defer></script>
</head>

<body>
  <!-- ヘッダー -->
  <header>

  </header>
  <!-- サイドメニュー -->
  <div class="side-bar"></div>
  <!-- メイン -->
  <main>
    <!-- Top -->
    <div class="topContents">
      <h1 class="topTitle">五反田<br>さんぽ</h1>
      <section class="splide" id="main-visual" aria-label="メインビジュアル">
        <div class="splide__track">
          <ul class="splide__list">
            <li class="splide__slide"><img src="./img/topImg01.jpg" alt="目黒川わきの通りの写真"></li>
            <li class="splide__slide"><img src="./img/topImg02.jpg" alt="御成橋浄化水の噴出"></li>
            <li class="splide__slide"><img src="./img/topImg03.jpg" alt="JR五反田駅"></li>
            <li class="splide__slide"><img src="./img/topImg04.jpg" alt="東急池上線五反田駅"></li>
          </ul>
        </div>
      </section>
    </div>
    

    <!-- Spot -->
    <section class="spot">
      <h2>Spot</h2>
      <!--五反田駅-->
      <div class="spot1"> 
        <img src="" alt="" class="topImg">
        <div class="spotInner">
          <div class="spotText">
            <p class="spotTitle">五反田駅</p>
            <p class="spotDsecription">JR/東急池上線/浅草線/国道1号線 が交差する五反田の玄関口。<br>「五反田」の地名は、江戸時代、目黒川周辺の低地に約五反（約1,500坪）田んぼが広がっていたことから来ているとか。</p>
          </div>
          <button type="button" 
            data-google="https://maps.app.goo.gl/SogEPpDGHgXMAQbu6"
            data-apple="https://maps.apple/p/ugK7pfAG9nYSsU" onclick="openMap(this)">
            Map
          </button>
        </div>
      </div>
      <!--袖ヶ崎神社-->
      <div class="spot2">
        <img src="" alt="" class="topImg">
        <div class="spotInner">
          <div class="spotText">
            <p class="spotTitle">袖ヶ崎神社</p>
            <p class="spotDsecription">東五反田（中原街道沿い）に位置し、約890年以上の歴史を持つ神社です。地域の人々のお守り神（鎮守様）として長年親しまれています。</p>
          </div>
          <button type="button" 
            data-google="https://maps.app.goo.gl/8LAGaSXRiReEhkeL7"
            data-apple="https://maps.apple/p/xmbAULGemTh_wU" onclick="openMap(this)">
            Map
          </button>
        </div>
      </div>
      <!-- 目黒川 -->
      <div class="spot1">
        <img src="" alt="" class="topImg">
        <div class="spotInner">
          <div class="spotText">
            <p class="spotTitle">目黒川</p>
            <p class="spotDsecription">江戸時代から水運の要として活躍し、現在は桜並木を堪能できる絶景スポットになっています。</p>
          </div>
          <button type="button" 
            data-google="https://maps.app.goo.gl/1RrAaqGKcS456iDL8"
            data-apple="https://maps.apple.com/frame?center=35.626379%2C139.719156&span=0.000479%2C0.000661" onclick="openMap(this)">
            Map
          </button>
        </div>
      </div>
    </section>

    <!-- history -->
    <section>
      <h2>History</h2>
    </section>

    <!-- gallery -->
    <section>
      <h2>gallery</h2>
    </section>
  </main>
</body>

</html>
